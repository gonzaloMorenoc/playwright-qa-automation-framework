name: Playwright Tests CI/CD

on:
  push:
    branches: [ main, develop, feature/* ]
  pull_request:
    branches: [ main, develop ]
  schedule:
    - cron: '0 2 * * *'  # Daily at 2 AM - only smoke tests

jobs:
  test:
    name: Run Tests
    timeout-minutes: 60
    runs-on: ubuntu-latest
    
    strategy:
      fail-fast: false
      matrix:
        include:
          # Scheduled runs: only smoke tests in dev
          - environment: dev
            browser: chromium
            test_type: smoke
            condition: ${{ github.event_name == 'schedule' }}
          # Manual/PR runs: full tests in dev
          - environment: dev
            browser: chromium
            test_type: full
            condition: ${{ github.event_name != 'schedule' }}
          - environment: dev
            browser: firefox
            test_type: full
            condition: ${{ github.event_name != 'schedule' }}
          - environment: dev
            browser: webkit
            test_type: full
            condition: ${{ github.event_name != 'schedule' }}
        
    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4
      
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '18'
        
    - name: Install Dependencies
      run: npm install
      
    - name: Install Playwright Browsers
      run: npx playwright install --with-deps
      
    - name: Run E2E Tests
      id: e2e-tests
      continue-on-error: true
      if: ${{ matrix.condition }}
      run: |
        if [ "${{ matrix.test_type }}" == "smoke" ]; then
          npm run test:smoke:dev
        else
          npm run test:${{ matrix.environment }}
        fi
      env:
        CI: true
        BROWSER: ${{ matrix.browser }}
        
    # Upload HTML report as artifact
    - name: Upload Playwright Report
      uses: actions/upload-artifact@v4
      if: always() && ${{ matrix.condition }}
      with:
        name: playwright-report-${{ matrix.environment }}-${{ matrix.browser }}
        path: playwright-report/
        retention-days: 30
        
    # Upload test results (screenshots, videos, traces)
    - name: Upload Test Results
      uses: actions/upload-artifact@v4
      if: always() && ${{ matrix.condition }}
      with:
        name: test-results-${{ matrix.environment }}-${{ matrix.browser }}
        path: test-results/
        retention-days: 30
        
    # Create test summary in GitHub Actions
    - name: Test Summary
      if: always() && ${{ matrix.condition }}
      run: |
        echo "## 🎭 Playwright Test Results" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "### Environment: ${{ matrix.environment }} | Browser: ${{ matrix.browser }}" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        
        if [ "${{ steps.e2e-tests.outcome }}" == "success" ]; then
          echo "✅ **Tests Passed**" >> $GITHUB_STEP_SUMMARY
        else
          echo "❌ **Tests Failed**" >> $GITHUB_STEP_SUMMARY
        fi
        
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "📊 [Download Full Report](https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }})" >> $GITHUB_STEP_SUMMARY

  # Publish test report to GitHub Pages
  publish-report:
    name: Publish Test Report
    runs-on: ubuntu-latest
    needs: test
    if: always()  # Always run, even if tests fail
    
    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4
      
    - name: Download all artifacts
      uses: actions/download-artifact@v4
      with:
        path: all-reports
        
    - name: Merge Reports
      run: |
        mkdir -p merged-report
        cp -r all-reports/playwright-report-*/* merged-report/ 2>/dev/null || true
        
    - name: Deploy to GitHub Pages
      uses: peaceiris/actions-gh-pages@v4
      if: github.ref == 'refs/heads/main'
      with:
        personal_token: ${{ secrets.PERSONAL_ACCESS_TOKEN }}
        publish_dir: ./merged-report
        enable_jekyll: false
        force_orphan: true
        
    - name: Comment PR with results
      if: github.event_name == 'pull_request'
      uses: actions/github-script@v7
      with:
        script: |
          const runUrl = `https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}`;
          const reportUrl = `https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}`;
          
          const comment = `## 🎭 Playwright Test Results
          
          ### 📊 Test Reports Available:
          - [View Test Run](${runUrl})
          - [View HTML Report](${reportUrl}) (only for main branch)
          
          ### 📦 Artifacts:
          Test reports and screenshots have been uploaded as artifacts in the workflow run.`;
          
          github.rest.issues.createComment({
            issue_number: context.issue.number,
            owner: context.repo.owner,
            repo: context.repo.repo,
            body: comment
          });